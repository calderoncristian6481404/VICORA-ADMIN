<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VICORA ADMIN</title><link rel="stylesheet" href="estilos.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="admin.js"></script>
</head>
<body>
<div id="login" class="auth-screen">
  <form id="loginForm" class="login-card">
    <div class="brand-mark">V</div>
    <h1>VICORA <span>ADMIN</span></h1>
    <p>Administración general de la plataforma</p>
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" autocomplete="username" required placeholder="correo@ejemplo.com">
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña">
    <button id="loginButton" type="submit">Ingresar</button>
    <div id="loginMessage" class="message" role="alert" aria-live="polite"></div>
  </form>
</div>
<div id="loading" class="loading-screen" hidden>Verificando acceso administrativo…</div>
<div id="app" hidden>
  <header class="topbar"><strong>VICORA <span>ADMIN</span></strong><div><span id="adminEmail"></span><button id="logoutButton">Cerrar sesión</button></div></header>
  <aside class="sidebar"><p>ADMINISTRACIÓN</p><button class="nav active" data-page="inicio">⌂ &nbsp; Inicio</button><button class="nav" data-page="negocios">▣ &nbsp; Negocios</button><button class="nav" data-page="suscripciones">◷ &nbsp; Suscripciones</button><button class="nav" data-page="pagos">▤ &nbsp; Pagos</button></aside>
  <main class="main"><div class="eyebrow">PANEL DE CONTROL</div><h2 id="pageTitle">Inicio</h2><p class="subtitle">Administración exclusiva de la plataforma VICORA</p><div id="pageContent"></div></main>
</div>
</body></html>
